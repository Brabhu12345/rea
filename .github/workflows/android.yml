
name: OpenTune Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OpenTune ARM64 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build ARM64 Debug APK
        run: ./gradlew assembleArm64Debug

      - name: List generated APKs
        run: find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenTune-arm64-debug
          path: app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 7
